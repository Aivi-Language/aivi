name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test release version policy
        run: python3 -m unittest discover -s tooling/release -p 'test_*.py'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            xvfb \
            xauth \
            dbus-x11

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check every target and feature
        run: cargo check --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings

      - name: Run workspace tests
        run: dbus-run-session -- xvfb-run -a cargo test --workspace --all-features --exclude aivi-lsp -- --test-threads=1
        env:
          GTK_A11Y: none
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GSETTINGS_BACKEND: memory

      - name: Run LSP tests
        run: cargo test -p aivi-lsp --all-features -- --test-threads=1

      - name: Build release workspace
        run: cargo build --workspace --release --all-features

  documentation-and-editor:
    name: Manual and VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libssl-dev \
            libdbus-1-dev \
            libsecret-1-dev \
            unzip

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: documentation-and-editor

      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            manual/pnpm-lock.yaml
            tooling/pnpm-lock.yaml

      - name: Install manual dependencies
        run: pnpm install --frozen-lockfile
        working-directory: manual

      - name: Install editor dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tooling

      - name: Check AIVI manual snippets
        run: ./tooling/check-manual-aivi-snippets.sh

      - name: Build manual and check links
        run: pnpm build
        working-directory: manual

      - name: Lint and test VS Code extension
        run: pnpm -F vscode-aivi lint && pnpm -F vscode-aivi test
        working-directory: tooling

      - name: Build and verify VSIX
        run: pnpm -F vscode-aivi build && pnpm -F vscode-aivi package
        working-directory: tooling

      - name: Audit manual dependencies
        run: pnpm audit --audit-level high
        working-directory: manual

      - name: Audit editor dependencies
        run: pnpm audit --audit-level high
        working-directory: tooling

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete
          fallback: none

      - name: Check advisories, licenses, and sources
        run: cargo deny check

      - name: Check unused direct dependencies
        run: cargo machete

  fuzz:
    name: Bounded fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-dev libssl-dev

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Smoke parser losslessness
        run: cargo +nightly fuzz run parser_lossless --target x86_64-unknown-linux-gnu -- -runs=512 -max_total_time=30
        working-directory: fuzz

      - name: Smoke hostile decoder paths
        run: cargo +nightly fuzz run decoder_paths --target x86_64-unknown-linux-gnu -- -runs=512 -max_total_time=30
        working-directory: fuzz
