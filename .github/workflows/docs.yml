name: Deploy Manual

on:
  push:
    branches: [main]
    paths:
      - 'manual/**'
      - 'tooling/packages/vscode-aivi/syntaxes/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: manual/pnpm-lock.yaml

      - name: Install manual dependencies
        run: pnpm install --frozen-lockfile
        working-directory: manual

      - name: Compute manual base path
        id: manual-base
        shell: bash
        run: |
          if [[ -f "manual/public/CNAME" ]]; then
            echo "base=/" >> "${GITHUB_OUTPUT}"
          else
            repo_name="${GITHUB_REPOSITORY#*/}"
            if [[ "${repo_name}" == *.github.io ]]; then
              echo "base=/" >> "${GITHUB_OUTPUT}"
            else
              echo "base=/${repo_name}/" >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: Build docs
        run: pnpm build
        working-directory: manual
        env:
          AIVI_MANUAL_BASE: ${{ steps.manual-base.outputs.base }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: manual/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
