[package]
name = "aivi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aivi-base.workspace = true
aivi-backend = { path = "../aivi-backend" }
aivi-core = { path = "../aivi-core" }
aivi-gtk = { path = "../aivi-gtk" }
aivi-hir.workspace = true
aivi-lambda = { path = "../aivi-lambda" }
aivi-openapi.workspace = true
aivi-query.workspace = true
aivi-runtime = { path = "../aivi-runtime" }
aivi-syntax.workspace = true
aivi-lsp = { path = "../aivi-lsp" }
postcard.workspace = true
gtk.workspace = true
adw.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rustix = { version = "1.1.4", features = ["process"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }
webkit6.workspace = true

[[bin]]
name = "aivi"
path = "src/main.rs"

[lints]
workspace = true
