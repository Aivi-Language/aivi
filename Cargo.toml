[workspace]
members = [
    "crates/aivi-base",
    "crates/aivi-ffi-call",
    "crates/aivi-core",
    "crates/aivi-lambda",
    "crates/aivi-hir",
    "crates/aivi-openapi",
    "crates/aivi-runtime",
    "crates/aivi-gtk",
    "crates/aivi-backend",
    "crates/aivi-syntax",
    "crates/aivi-cli",
    "crates/aivi-typing",
    "crates/aivi-query",
    "crates/aivi-lsp",
    "benches",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.98.0"
license = "GPL-3.0-only"

[workspace.dependencies]
aivi-base = { path = "crates/aivi-base" }
aivi-hir = { path = "crates/aivi-hir" }
aivi-lambda = { path = "crates/aivi-lambda" }
aivi-openapi = { path = "crates/aivi-openapi" }
aivi-syntax = { path = "crates/aivi-syntax" }
aivi-typing = { path = "crates/aivi-typing" }
aivi-query = { path = "crates/aivi-query" }
aivi-lsp = { path = "crates/aivi-lsp" }
adw = { package = "libadwaita", version = "0.9.2" }
cranelift-codegen = "0.135.0"
cranelift-frontend = "0.135.0"
cranelift-jit = "0.135.0"
cranelift-module = "0.135.0"
cranelift-native = "0.135.0"
cranelift-object = "0.135.0"
gio = "0.22.8"
glib = "0.22.8"
gtk = { package = "gtk4", version = "=0.11.3" }
gtk-sys = { package = "gtk4-sys", version = "=0.11.3" }
insta = { version = "1", features = ["ron"] }
num-bigint = "0.5.1"
regex-syntax = "0.8.10"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
webkit6 = "0.6.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
imap-proto = { path = "vendor/imap-proto" }
